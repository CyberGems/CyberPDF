name: Build and Release CyberPDF

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  tests:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore PDFium
        shell: pwsh
        run: ./scripts/Fetch-Pdfium.ps1

      - name: Run Tests
        run: dotnet test CyberPDF.slnx --configuration Release

  release:
    name: Build and Release
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}"
          }
          if ($v -eq "main" -or [string]::IsNullOrWhiteSpace($v)) {
            $v = "v0.1.0"
          }
          Write-Host "Determined Version: $v"
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Restore PDFium
        shell: pwsh
        run: ./scripts/Fetch-Pdfium.ps1

      - name: Publish
        shell: pwsh
        run: ./scripts/Publish-CyberPDF.ps1

      - name: Zip Published Output (Portable)
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish-win64/* -DestinationPath ./CyberPDF-${{ env.VERSION }}-Portable-win-x64.zip

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          # The installer version has no 'v' prefix; the tag keeps it.
          $bare = "${{ env.VERSION }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$bare" CyberPDF.iss

      # Upload the freshly built binaries to VirusTotal so the SHA256 links in
      # the release body resolve as soon as the release is published (new
      # builds are unknown to VirusTotal until someone submits them).
      - name: Scan installers with VirusTotal
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $bare = "${{ env.VERSION }}".TrimStart("v")
          $installerPath = "./CyberPDF-Setup-$bare.exe"
          $portablePath = "./CyberPDF-${{ env.VERSION }}-Portable-win-x64.zip"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installerPath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            try {
              Upload-VirusTotal $portablePath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal portable upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }
      - name: Prepare Release Notes
        shell: pwsh
        run: |
          $bare = "${{ env.VERSION }}".TrimStart("v")
          $installer = "./CyberPDF-Setup-$bare.exe"
          $portable = "./CyberPDF-${{ env.VERSION }}-Portable-win-x64.zip"
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.Replace("{{VERSION}}", "${{ env.VERSION }}").Replace("{{VERSION_BARE}}", $bare).Replace("{{INSTALLER_HASH}}", $installerHash).Replace("{{PORTABLE_HASH}}", $portableHash)
          # Maintainer guidance lives in the template as HTML comments; it must
          # not ship inside the published release body.
          $notes = [regex]::Replace($notes, '(?s)<!--.*?-->', '').Trim()
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.Encoding]::UTF8)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release_notes.md
          files: |
            CyberPDF-Setup-*.exe
            CyberPDF-*-Portable-win-x64.zip
      # Publish a downloadable checksum file so users can verify assets with
      # sha256sum -c without copying hashes from the release notes.
      - name: Publish SHA256SUMS.txt
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP 'sha256sums'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $assetNames = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets for $tag." }
          $portable = $assetNames | Where-Object { $_ -match 'portable' } | Select-Object -First 1
          $installer = $assetNames | Where-Object { $_ -match '\.(exe|msi)$' -and $_ -notmatch 'portable' } | Select-Object -First 1
          $wanted = @($installer, $portable) | Where-Object { $_ }
          if (-not $wanted) { throw "No installer or portable asset found for $tag." }

          gh release download $tag --dir $dir --clobber $(foreach ($name in $wanted) { "--pattern=$name" })
          if ($LASTEXITCODE -ne 0) { throw "Could not download release assets for $tag." }

          $lines = @()
          foreach ($name in $wanted) {
            $path = Join-Path $dir $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $checksumPath = Join-Path $dir 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($checksumPath, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          gh release upload $tag $checksumPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload SHA256SUMS.txt for $tag." }
